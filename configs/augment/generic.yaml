name: generic
family: generic
ops:
  - name: random_crop
    prob: 1.0
    params: {seconds: 30.0}
  - name: gain
    prob: 0.8
    params: {db_low: -6.0, db_high: 6.0}
  - name: gaussian_noise
    prob: 0.5
    params: {snr_db_low: 5.0, snr_db_high: 25.0}
  - name: time_mask
    prob: 0.5
    params: {max_fraction: 0.1, n_masks: 2}
  - name: polarity_flip
    prob: 0.5
    params: {}
