[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phase"
version = "0.1.0"
description = "Physics-Augmented Self-supervised Encoding for underwater acoustic target recognition"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "umap-learn>=0.5",
    "pandas>=2.0",
    "tqdm>=4.65",
    "wandb>=0.16",
    "timm>=0.9",
    "nnAudio>=0.3",
    "torch>=2.4,<3",
    "torchaudio>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]
data = [
    "kaggle>=1.6",
    "huggingface-hub>=0.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
