[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phase"
version = "0.1.0"
description = "Physics-Augmented Self-supervised Encoding for underwater acoustic target recognition"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.4",
    "scipy==1.15.3",
    "scikit-learn==1.8.0",
    "librosa==0.11.0",
    "soundfile==0.14.0",
    "pyyaml==6.0.2",
    "matplotlib==3.10.3",
    "umap-learn==0.5.12",
    "pandas==2.3.1",
    "tqdm==4.67.1",
    "wandb==0.29.0",
    "protobuf>=3.20,<7",
    "timm==1.0.19",
    "nnAudio==0.3.3",
    "torch>=2.4,<3",
    "torchaudio>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "ruff==0.12.7",
]
data = [
    "kaggle==1.7.4.5",
    "huggingface-hub==0.34.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
